name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  checks:
    name: Syntax and safety checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: PDF-Library/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: PDF-Library/backend
        run: npm ci

      - name: Backend syntax check
        working-directory: PDF-Library/backend
        run: npm run check

      - name: Secret file safety check
        working-directory: PDF-Library/backend
        run: npm run check:secret-files

      - name: Frontend JavaScript syntax check
        run: find PDF-Library/frontend/assets/js -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Cloudflare Function syntax check
        run: find PDF-Library/frontend/functions -name "*.js" -print0 | xargs -0 -n1 node --check
